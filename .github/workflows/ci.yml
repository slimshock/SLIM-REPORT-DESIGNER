name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install coordinated packages and test tools
        run: |
          python -m pip install -e "packages/slim_report_core[dev,database]"
          python -m pip install -e packages/slim_report_designer_ui
          python -m pip install -e "packages/slim_report_flask[database]"
          python -m pip install -e packages/slim_report_cli
      - run: python -m pytest -q -m "not mysql_integration and not browser"
      - run: python -m ruff check .
      - run: python -m mypy packages tests
      - run: python scripts/check_versions.py
      - run: python scripts/check_release_security.py

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build twine
      - name: Build all distributions
        run: |
          mkdir dist
          for package in packages/slim_report_*; do
            python -m build --outdir dist "$package"
          done
      - run: python -m twine check dist/*
      - run: python scripts/verify_wheel_contents.py dist
      - run: python scripts/clean_install_smoke.py dist
