[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slim-report-cli"
version = "0.0.0"
description = "Command-line tools for Slim Report Designer."
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Slim Report Designer contributors" }]
keywords = ["reports", "reporting", "cli", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "slim-report-core==0.0.0",
]

[project.scripts]
slim-report = "slim_report_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slim_report_cli"]

