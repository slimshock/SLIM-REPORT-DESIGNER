[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slim-report-core"
version = "0.7.0"
description = "Framework-agnostic core for Slim Report Designer."
readme = { text = "Framework-agnostic core package for Slim Report Designer. See the project repository for full documentation.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Slim Report Designer contributors" }]
keywords = ["reports", "reporting", "json", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "reportlab>=4.0",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1,<2"]
sqlalchemy = ["SQLAlchemy>=1.4"]
database = ["PyMySQL>=1.1,<2", "SQLAlchemy>=1.4"]
test = ["pytest>=8,<9"]
dev = ["build>=1.2,<2", "mypy>=1.10,<2", "pytest>=8,<9", "ruff>=0.6,<1", "twine>=5,<7"]
docs = ["mkdocs>=1.6,<2"]
all = ["PyMySQL>=1.1,<2", "SQLAlchemy>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/slim_report_core"]
