[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slim-report-designer-ui"
version = "0.6.0a0"
description = "Framework-agnostic static designer UI for Slim Report Designer."
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Slim Report Designer contributors" }]
keywords = ["reports", "reporting", "designer", "javascript"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.build.targets.wheel]
packages = ["slim_report_designer_ui"]
