<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slim Report Designer</title>
  <link rel="stylesheet" href="./css/designer.css">
</head>
<body>
  <main class="designer-app">
    <header class="top-toolbar" aria-label="Designer toolbar">
      <div class="brand">
        <span class="brand-mark">SR</span>
        <span>Slim Report Designer</span>
      </div>
      <div class="toolbar-spacer"></div>
      <div class="toolbar-actions" id="toolbar-actions"></div>
      <div class="template-title" id="template-title">Untitled Report</div>
    </header>

    <aside class="toolbox" aria-label="Toolbox">
      <div class="panel-tabs" role="tablist" aria-label="Left panel">
        <button class="panel-tab is-active" type="button" data-panel-tab="toolbox">Toolbox</button>
        <button class="panel-tab" type="button" data-panel-tab="fields">Fields</button>
      </div>
      <section class="left-panel is-active" data-panel="toolbox">
        <div class="panel-title">Toolbox</div>
        <p class="panel-help">Click a tool to add it to the page.</p>
        <button class="tool-button" type="button" data-tool="text" title="Add text object">
          <span class="tool-icon" data-icon="text">T</span>
          <span>Text</span>
        </button>
        <button class="tool-button" type="button" data-tool="field" title="Add data field object">
          <span class="tool-icon" data-icon="field">{ }</span>
          <span>Field</span>
        </button>
        <button class="tool-button" type="button" data-tool="line" title="Add line object">
          <span class="tool-icon" data-icon="line">-</span>
          <span>Line</span>
        </button>
        <button class="tool-button" type="button" data-tool="rectangle" title="Add rectangle object">
          <span class="tool-icon" data-icon="rectangle">[]</span>
          <span>Rectangle</span>
        </button>
        <button class="tool-button" type="button" data-tool="image" title="Add image object">
          <span class="tool-icon" data-icon="image">Img</span>
          <span>Image</span>
        </button>
        <button class="tool-button" type="button" data-tool="table" title="Add table object">
          <span class="tool-icon" data-icon="table">Tbl</span>
          <span>Table</span>
        </button>
      </section>
      <section class="left-panel" data-panel="fields" hidden>
        <div class="panel-title">Data Fields</div>
        <div class="field-panel-actions">
          <input id="field-search" type="search" placeholder="Search fields" aria-label="Search fields">
          <button id="sample-data-open" class="toolbar-button icon-action" type="button" title="View or edit sample data" aria-label="View or edit sample data" data-icon="database"></button>
        </div>
        <div id="fields-list" class="fields-list"></div>
      </section>
    </aside>

    <section class="canvas-shell" aria-label="Report canvas">
      <div class="canvas-scroller">
        <div class="canvas-zoom-shell" id="canvas-zoom-shell">
          <div id="page-canvas" class="page-canvas" tabindex="0" aria-label="A4 page canvas"></div>
        </div>
      </div>
    </section>

    <aside class="inspector" aria-label="Property inspector">
      <div class="panel-title">Inspector</div>
      <form id="inspector-form" class="inspector-form">
        <div class="empty-state">Select an object to edit its properties.</div>
      </form>
    </aside>

    <footer class="status-bar">
      <span id="status-message">Ready</span>
      <span id="selected-object">No selection</span>
      <span id="object-count">0 objects</span>
    </footer>
  </main>

  <div id="history-modal" class="modal-backdrop" hidden>
    <section class="history-modal" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <header class="history-header">
        <div>
          <h2 id="history-title">Version History</h2>
          <p id="history-key" class="history-subtitle">Local versions</p>
        </div>
        <button id="history-close" class="modal-icon-button" type="button" title="Close version history" aria-label="Close version history"></button>
      </header>
      <div class="history-actions">
        <button id="history-create" class="toolbar-button primary" type="button" title="Create manual version">Create Version</button>
        <button id="history-clear" class="toolbar-button danger" type="button" title="Clear local version history">Clear History</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </div>

  <div id="sample-data-modal" class="modal-backdrop" hidden>
    <section class="sample-data-modal" role="dialog" aria-modal="true" aria-labelledby="sample-data-title">
      <header class="history-header">
        <div>
          <h2 id="sample-data-title">Sample Data</h2>
          <p class="history-subtitle">JSON used for field discovery and designer preview.</p>
        </div>
        <button id="sample-data-close" class="modal-icon-button" type="button" title="Close sample data" aria-label="Close sample data"></button>
      </header>
      <div class="sample-data-body">
        <textarea id="sample-data-json" spellcheck="false" aria-label="Sample data JSON"></textarea>
        <p id="sample-data-error" class="field-warning" hidden></p>
      </div>
      <footer class="sample-data-actions">
        <button id="sample-data-apply" class="toolbar-button primary" type="button">Apply</button>
      </footer>
    </section>
  </div>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./js/designer.js"></script>
</body>
</html>
