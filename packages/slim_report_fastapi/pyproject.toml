[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slim-report-fastapi"
version = "0.5.0a1"
description = "Future FastAPI adapter for Slim Report Designer."
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Slim Report Designer contributors" }]
keywords = ["reports", "reporting", "fastapi", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "slim-report-core==0.5.0a1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[tool.hatch.build.targets.wheel]
packages = ["src/slim_report_fastapi"]
