[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slim-report-flask"
version = "0.5.0a1"
description = "Flask adapter for Slim Report Designer."
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Slim Report Designer contributors" }]
keywords = ["reports", "reporting", "flask", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "Flask>=3.0",
  "slim-report-core==0.5.0a1",
  "slim-report-designer-ui==0.5.0a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slim_report_flask"]
