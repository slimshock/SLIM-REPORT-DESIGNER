[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/slim_report_core/src",
  "packages/slim_report_flask/src",
  "packages/slim_report_django/src",
  "packages/slim_report_fastapi/src",
  "packages/slim_report_cli/src",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
  "packages/slim_report_core/src",
  "packages/slim_report_flask/src",
  "packages/slim_report_django/src",
  "packages/slim_report_fastapi/src",
  "packages/slim_report_cli/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["packages", "tests"]

